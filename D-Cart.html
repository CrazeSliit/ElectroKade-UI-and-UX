<style>
body{margin:0;font-family:'Open Sans', system-ui, sans-serif;color:#0F1419;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#0C6DB0;text-decoration:none}a:hover{color:#0F1419}
button,input,select,textarea{font-family:inherit}
input::placeholder,textarea::placeholder{color:#7A8691}
.ek-card{transition:box-shadow .2s ease, transform .2s ease, border-color .2s ease}
.ek-card:hover{box-shadow:0 10px 30px rgba(15,20,25,.08);transform:translateY(-2px);border-color:#CFDDE6}
.ek-btn{transition:filter .15s ease, transform .15s ease}
.ek-btn:hover{filter:brightness(.94)}.ek-btn:active{transform:scale(.98)}
.ek-link:hover{color:#0C6DB0}
.ek-field:focus{outline:none;border-color:#1E9DF1;box-shadow:0 0 0 3px rgba(30,157,241,.18)}
@keyframes ekspin{to{transform:rotate(360deg)}}
@keyframes ekpop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes ekdraw{to{stroke-dashoffset:0}}
@keyframes ekshimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
@keyframes ekflip{from{opacity:.6}to{opacity:1}}
</style>

<style>
body.desktop #app > div { min-height: 0 !important; }
body.mobile { background: #E9EDF1; }
body.mobile #app { width: 390px; margin: 24px auto 48px; background: #FFFFFF; border-radius: 36px; box-shadow: 0 30px 80px rgba(15,20,25,.18); transform: translateZ(0); overflow: clip; }
body.mobile #app > div { min-height: 844px !important; }
.ek-back { position: fixed; left: 16px; bottom: 16px; z-index: 9999; display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; background: #0F1419; color: #FFFFFF !important; font: 600 13px 'Open Sans', system-ui, sans-serif; text-decoration: none; box-shadow: 0 6px 20px rgba(15,20,25,.25); opacity: .85; }
.ek-back:hover { opacity: 1; }
@media (max-width: 430px) { body.mobile #app { margin: 0 auto; border-radius: 0; box-shadow: none; } .ek-back { display: none; } }
</style>
